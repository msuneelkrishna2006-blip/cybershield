<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberShield India</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 360px; min-height: 200px; background: #0a0e1a; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .header { padding: 16px; background: linear-gradient(135deg, #FF9933 0%, #138808 50%, #000080 100%); text-align: center; }
    .header h1 { font-size: 16px; font-weight: 900; color: #fff; letter-spacing: -0.5px; }
    .header p { font-size: 10px; color: rgba(255,255,255,0.8); margin-top: 2px; }
    .content { padding: 16px; }
    .status-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 16px; margin-bottom: 12px; text-align: center; }
    .risk-score { font-size: 48px; font-weight: 900; line-height: 1; }
    .risk-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }
    .safe { color: #10b981; }
    .low { color: #3b82f6; }
    .medium { color: #f59e0b; }
    .high { color: #ef4444; }
    .critical { color: #dc2626; }
    .indicators { margin-top: 12px; }
    .indicator { font-size: 11px; color: #94a3b8; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .action-text { font-size: 12px; font-weight: 600; margin-top: 8px; padding: 8px 12px; border-radius: 8px; }
    .action-safe { background: rgba(16,185,129,0.1); color: #10b981; }
    .action-caution { background: rgba(245,158,11,0.1); color: #f59e0b; }
    .action-danger { background: rgba(239,68,68,0.1); color: #ef4444; }
    .btn { display: block; width: 100%; padding: 12px; border: none; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; margin-top: 8px; }
    .btn-scan { background: linear-gradient(135deg, #FF9933, #f97316); color: #fff; }
    .btn-scan:hover { opacity: 0.9; }
    .btn-scan:disabled { opacity: 0.5; cursor: not-allowed; }
    .loading { text-align: center; padding: 20px; color: #64748b; font-size: 12px; }
    .spinner { width: 24px; height: 24px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #FF9933; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .footer { padding: 12px 16px; text-align: center; border-top: 1px solid rgba(255,255,255,0.05); }
    .footer a { color: #FF9933; text-decoration: none; font-size: 11px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🛡️ CyberShield India</h1>
    <p>AI-Powered Digital Safety</p>
  </div>

  <div class="content">
    <div id="initial" class="status-card">
      <p style="font-size: 12px; color: #94a3b8;">Click below to scan the current page</p>
      <button class="btn btn-scan" id="scanBtn" onclick="scanPage()">🔍 Scan This Page</button>
    </div>

    <div id="loading" class="loading" style="display:none;">
      <div class="spinner"></div>
      <p>Analyzing page for threats...</p>
    </div>

    <div id="result" class="status-card" style="display:none;">
      <div class="risk-score" id="riskScore">0</div>
      <div class="risk-label" id="riskLabel">SAFE</div>
      <div class="indicators" id="indicators"></div>
      <div class="action-text" id="actionText"></div>
      <button class="btn btn-scan" onclick="scanPage()" style="margin-top:12px;">↻ Rescan</button>
    </div>
  </div>

  <div class="footer">
    <a href="https://cybershield.in/app" target="_blank">Open CyberShield Dashboard →</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
